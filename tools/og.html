<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>OG card</title>
<!-- Rendered to assets/img/og.jpg by tools/render_images.py. Reuses the hero art from index.html. -->
<link rel="stylesheet" href="../assets/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: linear-gradient(180deg, #f6eee1 0%, #f7e6c6 34%, #f4cb8e 52%, #efb674 59.4%);
  }
  .card-text { position: absolute; z-index: 1; left: 72px; top: 60px; right: 72px; }
  body::before { content: ""; position: absolute; z-index: 2; left: 0; right: 0; top: 0; height: 14px; background: var(--navy); border-bottom: 3px solid var(--gold); }
  .card-text .eyebrow { font: 650 20px/1.2 var(--sans); letter-spacing: .15em; margin-bottom: 18px; color: var(--gold-deep); }
  .card-text h1 { font-size: 112px; margin: 0; }
  .card-text .h1-line { font-size: .5em; margin-top: .1em; }
  .badge { position: absolute; z-index: 1; right: 76px; top: 52px; width: 236px; height: 236px; border-radius: 50%; box-shadow: 0 0 0 5px #f6eee1, 0 0 0 7px var(--gold), 0 16px 36px -14px rgba(2, 22, 54, .45); }
  .art { position: absolute; inset: 0; }
  .art svg { width: 100%; height: 100%; }
  .h-sun, .h-glitter { animation: none !important; }
  .art .h-birds { display: none; }
</style>
</head>
<body>
  <div class="card-text">
    <p class="eyebrow">Nkhotakota · Malawi</p>
    <h1>Chankhasi <span class="h1-line">Private School</span></h1>
  </div>
  <img class="badge" src="../assets/img/logo/badge-480.webp" width="480" height="480" alt="">
  <div class="art" id="art"></div>
  <script>
    fetch('../index.html').then(function (r) { return r.text(); }).then(function (html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var svg = doc.querySelector('.hero-art svg');
      svg.setAttribute('viewBox', '120 186 1360 714');
      document.getElementById('art').appendChild(document.importNode(svg, true));
      document.fonts.ready.then(function () { document.body.setAttribute('data-ready', '1'); });
    });
  </script>
</body>
</html>
